base:
    repeat_num: 1

dataset:
    root_path: '/shared/shared/FAS_AUG'
    test_path: '/shared/shared/'
    source: 'c'    # c, i, o, m, ci, ..., cio, ..., ciom
    target: 'i'    # c, i, o, m, ci, ..., cio, ..., ciom
    batch_size: 128
    num_workers: 8
    classnames:
        - 'a photo of a real face'
        - 'a photo of a spoof face'
    # Hierarchical classification labels
    attack_types:
        - 'a photo of a real face'
        - 'a photo of a print attack'
        - 'a photo of a replay attack'
    artifact_types:
        - 'a face with realistic texture'
        - 'a face with bnhalftone artifact'
        - 'a face with distortion artifact'
        - 'a face with sfchalftone artifact'
        - 'a face with moire pattern artifact'
        - 'a face with reflection artifact'

transforms:
    imgSize: 224
    mean:
        - 0.535
        - 0.419
        - 0.358
    std:
        - 0.276
        - 0.251
        - 0.242

model:
    mode: UniBiFAS 
    backbone: ViT-B/16
    n_ctx: 8                     # Number of learnable tokens per prompt
    prompt_depth: 12             # Max 12, Min 1 ,for 1 it will act as a shallow MaPLe (J = 1)
    interaction_layers: [7, 10]   # Layers 0-3: V->T, 4-7: V<->T, 8-11: T->V

train:
    epochs: 30                 # Number of epochs
    print_interval: 1            # Print metrics every N epochs
    amp: True
    save_path: 'output'

train_visual_prompt:
    lr: 1.0e-2                    # Learning rate for visual prompt tuning
    weight_decay: 1.0e-3          # Weight decay for visual prompt tuning
    temp: 0.2                     # Temperature for contrastive loss
    lambda_known: 0.5             # Weight for known samples in contrastive loss
    lambda_artifact: 0.3          # Weight for artifact samples in contrastive loss
    epochs: 100                     # Number of epochs for visual prompt tuning
    save_path: 'output/visual_prompt.pth'  # Path to save visual prompt

optimizer:
  name: Adam
  params:
    lr: 1.0e-4                    # Increased from 2.5e-6 (40x higher)
    weight_decay: 1.0e-4          # Increased regularization to prevent overfitting

scheduler:
    params:
        use: True                  # Enable learning rate scheduling
        step_each_epoch: 100
        total_epochs: 30           # Match training epochs
        warmup: True
        warmup_epochs: 3           # Gradual warmup over 3 epochs
        warmup_factor: 1.0e-2      # Start from lr * 0.01

loss_weights:
    binary: 1.0
    attack: 0.5
    artifact: 0.5
    segmentation: 0.5

inference_weights:
    binary: 0.4
    attack: 0.4
    artifact: 0.2

losses:
    cls_b:
        name: CrossEntropyLoss
        params:
            reduction: mean
    cls_a:
        name: CrossEntropyLoss
        params:
            reduction: mean
    cls_art:
        name: CrossEntropyLoss
        params:
            reduction: mean
    seg:
        name: L1Loss
        params:
            reduction: mean
        